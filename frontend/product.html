
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Nexora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Nexora</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#products">Products</a>
            <a href="cart.html" id="cart-count">Cart (0)</a>
        </nav>
    </header>

    <main class="product-details">

        <div class="product-detail-image">
            <img
                id="detail-image"
                src="https://placehold.co/500x400?text=Product"
                alt="Product Image"
            >
        </div>

        <div class="product-detail-info">
            <p class="product-category">Loading category...</p>

            <h1 id="detail-name">Loading product...</h1>

            <h2 id="detail-price">$0.00</h2>

            <p id="detail-description">
                Product description will appear here.
            </p>

            <button id="detail-add-button" disabled>
                Add to Cart
            </button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
