
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Nexora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Nexora</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#products">Products</a>
            <a href="cart.html" id="cart-count">Cart (0)</a>
        </nav>
    </header>

    <main class="cart-page">
        <div class="cart-heading">
            <h1>Shopping Cart</h1>
            <a href="index.html#products">Continue Shopping</a>
        </div>

        <div class="cart-layout">
            <section class="cart-products">
                <h2>Your Products</h2>
                <div id="cart-items">
                    <p>Your cart is empty.</p>
                </div>
            </section>

            <aside class="cart-summary">
                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-total">$0.00</span>
                </div>

                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>

                <div class="summary-divider"></div>

                <button id="checkout-button" type="button">
                    Proceed to Checkout
                </button>

                <p class="secure-message">Secure Shopping Experience</p>
            </aside>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
